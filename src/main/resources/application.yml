spring:
  application:
    name: daret-backend
  lifecycle:
    # Grace period for graceful shutdown to drain requests.
    timeout-per-shutdown-phase: 30s
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/daret}
    username: ${SPRING_DATASOURCE_USERNAME:daret}
    password: ${SPRING_DATASOURCE_PASSWORD:daret}
  jpa:
    hibernate:
      # Schema is owned by Flyway, never by Hibernate. Validate only.
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration

daret:
  jwt:
    # Base64-encoded HMAC secret. Override in every real environment.
    secret: ${DARET_JWT_SECRET:ZGV2LW9ubHktc2VjcmV0LWNoYW5nZS1tZS1pbi1wcm9kdWN0aW9uLTEyMzQ1Ng==}
    access-ttl-minutes: ${DARET_JWT_ACCESS_TTL_MIN:15}
    refresh-ttl-days: ${DARET_JWT_REFRESH_TTL_DAYS:30}
  auth:
    # Fixed-window rate limit for /auth endpoints (per client IP).
    rate-limit:
      max-requests: ${DARET_AUTH_RATELIMIT_MAX:10}
      window-seconds: ${DARET_AUTH_RATELIMIT_WINDOW:60}
    # Account lockout after repeated failed logins (per identifier).
    lockout:
      max-attempts: ${DARET_AUTH_LOCKOUT_MAX:5}
      lock-minutes: ${DARET_AUTH_LOCKOUT_MINUTES:15}
  payments:
    mock:
      # 0.0 = never fail. Raise to exercise retry/default paths.
      failure-rate: ${DARET_MOCK_FAILURE_RATE:0.0}
      # Mock settles COLLECT/DISBURSE immediately (MVP). Set false to simulate async.
      settle-immediately: ${DARET_MOCK_SETTLE_IMMEDIATELY:true}
      # When async, a pending movement settles when polled by the reconciler.
      auto-settle-on-poll: ${DARET_MOCK_AUTO_SETTLE_ON_POLL:false}
    webhook:
      # HMAC-SHA256 secret to verify inbound PSP webhooks. Override in prod.
      secret: ${DARET_PSP_WEBHOOK_SECRET:dev-webhook-secret-change-me}
  scheduler:
    enabled: ${DARET_SCHEDULER_ENABLED:true}
    interval-ms: ${DARET_SCHEDULER_INTERVAL_MS:60000}
    reconcile-interval-ms: ${DARET_RECONCILE_INTERVAL_MS:30000}
  seed:
    # Seed a demo dataset on startup (spec §16). Never enable in production.
    enabled: ${DARET_SEED_ENABLED:false}
  risk:
    # Max fraction of a circle's seats the platform may gap-fill (spec §5.4).
    max-platform-exposure-pct: ${DARET_MAX_EXPOSURE_PCT:0.10}
    # Days after a due date before an unpaid contribution is marked MISSED.
    contribution-grace-days: ${DARET_GRACE_DAYS:3}
    # Missed contributions before a member is DEFAULTED.
    default-after-missed: ${DARET_DEFAULT_AFTER_MISSED:2}
    # Payout amount (MAD) above which an AML LARGE_MOVEMENT flag is raised.
    aml-large-amount: ${DARET_AML_LARGE_AMOUNT:50000}

management:
  endpoints:
    web:
      exposure:
        include: health, info, metrics, prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when-authorized
      # Kubernetes-style probes: liveness = process healthy (restart if down),
      # readiness = ready to serve traffic (also gates on the database).
      group:
        liveness:
          include: livenessState
        readiness:
          include: readinessState, db
  info:
    build:
      enabled: true
    env:
      enabled: true
  metrics:
    tags:
      application: ${spring.application.name}
  prometheus:
    metrics:
      export:
        enabled: true

info:
  app:
    name: Daret
    description: Digital rotating-savings (ROSCA) platform

server:
  port: 8080
  forward-headers-strategy: framework
  # Drain in-flight requests before exit (rolling deploys, SIGTERM).
  shutdown: graceful

springdoc:
  swagger-ui:
    path: /swagger-ui.html
